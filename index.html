<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Little Question ❤️</title>
<style>
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; overflow:hidden;
  font-family:Arial, sans-serif;
  background:linear-gradient(135deg,#ffd6e2,#fff5f8,#ffc1d2);
  color:#241719;
}
.page{
  min-height:100vh; display:none; place-items:center; position:relative;
  padding:25px;
}
.page.active{display:grid}
.card{
  width:min(92vw,650px); min-height:600px; padding:45px 25px;
  border-radius:28px; text-align:center;
  background:rgba(255,255,255,.72);
  box-shadow:0 15px 45px rgba(180,70,100,.2);
  backdrop-filter:blur(8px);
  position:relative; overflow:hidden;
}
h1{font-size:clamp(2.1rem,7vw,4rem); margin:35px 0 25px}
.question{font-size:clamp(1.5rem,5vw,2.2rem); font-weight:bold}
.heart{font-size:4rem; animation:pulse 1.3s infinite}
.buttons{display:flex; justify-content:center; gap:25px; margin-top:35px; flex-wrap:wrap}
button{
  border:0; border-radius:50px; padding:16px 38px; font-size:1.25rem;
  font-weight:bold; cursor:pointer; box-shadow:0 7px 18px rgba(0,0,0,.15);
}
.yes{background:#21b83b;color:white}
.no{background:#ef3030;color:white}
#no1,#no2{position:relative}
.note{margin-top:25px;font-size:1rem}
.photo{
  width:min(70vw,300px); height:min(70vw,300px); object-fit:cover;
  border-radius:50%; border:9px solid white;
  box-shadow:0 0 0 3px #ff7895, 0 12px 30px rgba(150,40,70,.25);
}
.love{
  color:#f02e59; font-size:clamp(2.5rem,9vw,4.5rem); margin:20px 0 8px;
  font-weight:900;
}
.final{font-size:1.4rem; color:#333}
.floating{position:absolute; font-size:2rem; opacity:.65; animation:float 5s ease-in-out infinite}
.f1{top:8%;left:8%}.f2{top:15%;right:10%;animation-delay:1s}
.f3{bottom:12%;left:12%;animation-delay:2s}.f4{bottom:15%;right:8%;animation-delay:3s}
@keyframes pulse{50%{transform:scale(1.15)}}
@keyframes float{50%{transform:translateY(-25px) rotate(8deg)}}
@media(max-width:500px){.card{min-height:540px;padding:30px 18px}.buttons{gap:14px}button{padding:14px 30px}}
</style>
</head>
<body>

<section id="page1" class="page active">
  <div class="floating f1">❤️</div><div class="floating f2">💕</div>
  <div class="floating f3">💗</div><div class="floating f4">💖</div>
  <div class="card">
    <div class="heart">❤️</div>
    <h1>I Have a Question<br>For You</h1>
    <div class="question">Will you say YES? 🥰</div>
    <div class="buttons">
      <button class="yes" onclick="showPage2()">❤️ YES</button>
      <button class="no" id="no1">😈 NO</button>
    </div>
    <div class="note">(Try clicking NO 😜)</div>
  </div>
</section>

<section id="page2" class="page">
  <div class="floating f1">❤️</div><div class="floating f2">💕</div>
  <div class="floating f3">💗</div><div class="floating f4">💖</div>
  <div class="card">
    <img src="photo.jpg" class="photo" alt="Photo">
    <div class="love">I Love You ❤️</div>
    <div class="final">Do you love me?</div>
    <div class="buttons">
      <button class="yes" onclick="yesAnswer()">❤️ YES</button>
      <button class="no" id="no2">😈 NO</button>
    </div>
    <div class="note">(Try clicking NO 😜)</div>
  </div>
</section>

<script>
function showPage2(){
  document.getElementById("page1").classList.remove("active");
  document.getElementById("page2").classList.add("active");
}
function moveButton(btn){
  const pad=15;
  const maxX=Math.max(pad,window.innerWidth-btn.offsetWidth-pad);
  const maxY=Math.max(pad,window.innerHeight-btn.offsetHeight-pad);
  btn.style.position="fixed";
  btn.style.left=Math.random()*maxX+"px";
  btn.style.top=Math.random()*maxY+"px";
}
["no1","no2"].forEach(id=>{
  const b=document.getElementById(id);
  b.addEventListener("mouseenter",()=>moveButton(b));
  b.addEventListener("touchstart",e=>{e.preventDefault();moveButton(b)});
  b.addEventListener("click",e=>{e.preventDefault();moveButton(b)});
});
function yesAnswer(){
  document.querySelector("#page2 .card").innerHTML =
    '<div class="heart">💖</div><div class="love">YAY!!! ❤️</div>' +
    '<div class="final">I knew it! 🥰💕</div><div style="font-size:4rem;margin-top:25px">💞💞💞</div>';
}
</script>
</body>
</html>
